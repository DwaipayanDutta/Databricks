name: Python CI

# Runs on every push/PR to main: lint (ruff), format-check (black),
# strict type-check (mypy), security scan (bandit + pip-audit), and the
# pytest suite with coverage -- matching what README.md's "CI/CD" section
# and CHANGELOG.md document. A second job builds (but does not push) the
# Docker image after the lint/type-check/test job succeeds, so a broken
# Dockerfile/pyproject.toml install step is caught in CI, not in production.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, type-check, security scan, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: ruff check
        run: ruff check .

      - name: black --check
        run: black --check .

      - name: mypy --strict
        run: mypy --strict databricks_connector tests

      - name: bandit
        run: bandit -r databricks_connector -c pyproject.toml

      - name: pip-audit
        run: pip-audit

      - name: pytest with coverage
        run: pytest -v --cov=databricks_connector --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: databricks-connector:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
