version: "3.9"

services:
  databricks-connector:
    build:
      context: .
      dockerfile: Dockerfile
    image: databricks-connector:latest
    container_name: databricks-connector
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - connector-net

  redis:
    image: redis:7-alpine
    container_name: databricks-connector-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - connector-net

networks:
  connector-net:
    driver: bridge
