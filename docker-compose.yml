services:
  databricks-connector:
    build:
      context: .
      dockerfile: Dockerfile
    image: databricks-connector:latest
    container_name: databricks-connector
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      # Override whatever REDIS_URL/CACHE_ENABLED came from .env: inside
      # this compose network the Redis service is reachable at the
      # hostname `redis`, never `localhost` (that would resolve to the
      # connector container itself). `environment:` here takes precedence
      # over `env_file:` per Compose semantics, so a stock `.env` copied
      # from `.env.example` (which defaults to `redis://localhost:6379/0`)
      # still works correctly under `docker compose up`.
      - CACHE_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - connector-net

  redis:
    image: redis:7-alpine
    container_name: databricks-connector-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - connector-net

networks:
  connector-net:
    driver: bridge
